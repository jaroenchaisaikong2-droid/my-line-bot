# ========================================================================
# โปรแกรม: Line Daily Sender (ระบบส่งข้อความเข้ากลุ่ม LINE อัตโนมัติ)
# คำอธิบาย: ทำหน้าที่ปลุกบอทขึ้นมาตรวจสอบตารางงาน JSON ทุกๆ 30 นาที 
#         หากพบว่ามีคิวงานตรงกับเวลาปัจจุบันของไทย จะดึงข้อมูลไปส่งเข้ากลุ่ม LINE ทันที
# ========================================================================

name: Line Daily Sender

# ------------------------------------------------------------------------
# เงื่อนไขการสั่งให้บอทเริ่มทำงาน (Triggers)
# ------------------------------------------------------------------------
on:
  schedule:
    # ตั้งเวลาให้บอทตื่นขึ้นมาเช็คไฟล์ตารางงาน JSON ทุกๆ นาทีที่ 0 และ 30 ของทุกชั่วโมง (เวลาสากล UTC)
    # เช่น 08:00 (ไทย) = 01:00 (UTC) บอทจะตื่นมาเช็คตอนนาทีที่ 0 เป๊ะ
    # เช่น 08:30 (ไทย) = 01:30 (UTC) บอทจะตื่นมาเช็คตอนนาทีที่ 30 เป๊ะ
    - cron: '0,30 * * * *'
    
  workflow_dispatch: 
    # เปิดฟังก์ชัน "Run workflow" ให้เราสามารถกดปุ่มสั่งส่งข้อความเองด้วยมือได้ตลอดเวลา (Manual)

# ------------------------------------------------------------------------
# ขั้นตอนการทำงานของบอท (Jobs & Steps)
# ------------------------------------------------------------------------
jobs:
  send:
    # สั่งให้บอทรันบนระบบปฏิบัติการ Linux (Ubuntu) เวอร์ชันล่าสุด (ประหยัดเวลาโควตาฟรี)
    runs-on: ubuntu-latest 
    
    steps:
      # ขั้นตอนที่ 1: ดึงไฟล์โค้ดและไฟล์ตารางงานทั้งหมดจาก GitHub Repository ลงมาเตรียมไว้ที่เครื่อง Linux
      - name: Check out repository
        uses: actions/checkout@v4
      
      # ขั้นตอนที่ 2: สั่งรันสคริปต์ PowerShell เพื่อตรวจสอบเวลาและส่งข้อความเข้า LINE
      - name: Run send script
        shell: pwsh # บังคับใช้งาน PowerShell เวอร์ชันใหม่ (PowerShell Core) บนเครื่อง Linux
        run: |
          # [สำคัญมากสำหรับ Linux] เพิ่มสิทธิ์ความปลอดภัย (Permission) ให้ระบบสามารถสั่งรันสคริปต์ได้ 
          # หากไม่มีบรรทัดนี้ จะติด Error "Permission Denied"
          chmod +x ./send.ps1
          
          # สั่งรันไฟล์สคริปต์หลักเพื่อเริ่มตรวจสอบคิวงานใน schedule_tasks.json
          ./send.ps1
          
        # การส่งรหัสลับความปลอดภัย (Secrets) จากระบบตู้เซฟของ GitHub เข้าไปใช้งานในสคริปต์
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}       # รหัสบอทส่งข้อความ (Channel Access Token)
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }} # รหัสกลุ่มไลน์ (รองรับการใส่หลายกลุ่มโดยคั่นด้วยเครื่องหมายลูกน้ำ ,)
          GOOGLE_SHEET_API_URL: ${{ secrets.GOOGLE_SHEET_API_URL }} # เพิ่มบรรทัดนี้เข้าไป

name: Line Daily Sender
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest # เปลี่ยนมารันบนเครื่อง Linux แทน
    steps:
      - uses: actions/checkout@v4
      - name: Run send script
        shell: pwsh # ใช้ PowerShell เวอร์ชันใหม่ (Core)
        run: ./send.ps1
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
